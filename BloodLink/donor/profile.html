<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile | BloodLink</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header>
<h1>BloodLink</h1>
<nav><a href="dashboard.html">Dashboard</a> | <a href="profile.html">My Profile</a> | <a href="requests.html">Matching Requests</a> | <a href="history.html">Donation History</a> | <a href="../login.html">Logout</a></nav>
</header>
<main>
<h2>My Profile</h2>
<form action="#" method="post">
<p><label for="full_name">Full name</label><br><input type="text" id="full_name" name="full_name" required></p>
<p><label for="email">Email</label><br><input type="email" id="email" name="email" required></p>
<p><label for="phone">Phone number</label><br><input type="tel" id="phone" name="phone" required></p>
<p><label for="blood_group">Blood group</label><br><select id="blood_group" name="blood_group"><option value="A+">A+</option><option value="A-">A-</option><option value="B+">B+</option><option value="B-">B-</option><option value="O+">O+</option><option value="O-">O-</option><option value="AB+">AB+</option><option value="AB-">AB-</option></select></p>
<p><label for="area">Area / City</label><br><input type="text" id="area" name="area" required></p>
<p><label for="last_donation_date">Last donation date</label><br><input type="date" id="last_donation_date" name="last_donation_date" ></p>
<p><input type="checkbox" id="available" name="available" checked> <label for="available">I am available to donate</label></p>
<button type="submit">Save Changes</button>
</form>
</main>
<footer>
<p>&copy; 2026 BloodLink - Blood Donor Finder</p>
</footer>
</body>
</html>
