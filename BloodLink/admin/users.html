<main>
<h2>Manage Users</h2>
<form action="#" method="get">
<p><label for="role">Role</label><br><select id="role" name="role"><option value="">All roles</option><option value="donor">Donor</option><option value="patient">Patient</option><option value="hospital">Hospital</option></select></p>
<p><label for="status">Status</label><br><select id="status" name="status"><option value="">All statuses</option><option value="pending">Pending</option><option value="active">Active</option><option value="suspended">Suspended</option></select></p>
<button type="submit">Filter</button>
</form>
<table border="1"><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr><td>1</td><td>[Name]</td><td>[email]</td><td>Donor</td><td>Pending</td><td><button type="button">Approve</button> <button type="button">Suspend</button> <button type="button">Delete</button></td></tr><tr><td>2</td><td>[Name]</td><td>[email]</td><td>Hospital</td><td>Active</td><td><button type="button">Approve</button> <button type="button">Suspend</button> <button type="button">Delete</button></td></tr><tr><td>3</td><td>[Name]</td><td>[email]</td><td>Patient</td><td>Suspended</td><td><button type="button">Approve</button> <button type="button">Suspend</button> <button type="button">Delete</button></td></tr></tbody></table>
</main>
