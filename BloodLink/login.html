<!DOCTYPE html>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | BloodLink</title>

<body>
<header>
<h1>BloodLink</h1>
<nav><a href="index.html">Home</a> | <a href="camps.html">Donation Camps</a> | <a href="login.html">Login</a> | <a href="register.html">Register</a></nav>
</header>
<main>
<h2>Login</h2>
<form action="#" method="post">
<p><label for="email">Email</label><br><input type="email" id="email" name="email" required></p>
<p><label for="password">Password</label><br><input type="password" id="password" name="password" required></p>
<p><label for="role">Login as</label><br><select id="role" name="role"><option value="donor">Donor</option><option value="patient">Patient / Requester</option><option value="hospital">Hospital / Blood Bank</option><option value="admin">Admin</option></select></p>
<button type="submit">Login</button>
</form>
<p>No account? <a href="register.html">Register here</a></p>
</main>
<footer>
<p>&copy; 2026 BloodLink - Blood Donor Finder</p>
</footer>
</body>
</html>
